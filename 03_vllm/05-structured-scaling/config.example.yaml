# Configuración del experimento. Cópialo (p. ej. config.yaml) y ajústalo.
# El job_id no se pone aquí: llega por --job-id (o SLURM_JOB_ID, o "local").
global:
  dataset_name: nbel/EsCoLA
  dataset_split: train
  total_samples: 50          # filas del dataset a procesar
  output_dir: ./outputs
  wandb_project: vllm-scaling
  health_timeout: 600        # segundos máximos esperando a /health
  health_interval: 10
  system_prompt: |
    Eres un experto en la lengua española.
    Debes evaluar si la siguiente frase es correcta o no acorde a tu criterio.
    Responde indicando si es 'Correcta' o 'Incorrecta', y luego brinda una breve explicación
    de tu veredicto.

models:
  - name: Qwen/Qwen2.5-0.5B-Instruct
    port: 8000
    max_concurrent_requests: 5
    vllm:
      dtype: bfloat16        # A100 (la V100 no soporta bfloat16)
      max_model_len: 2048
      max_num_seqs: 5
      gpu_memory_utilization: 0.90

  - name: Qwen/Qwen2.5-7B-Instruct
    port: 8000
    max_concurrent_requests: 10
    vllm:
      dtype: bfloat16
      max_model_len: 4096
      max_num_seqs: 10
      gpu_memory_utilization: 0.90
