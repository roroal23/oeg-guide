[project]
name = "chat-and-rag-streamlit"
version = "0.1.0"
description = "App Streamlit multipágina: chat con Ollama y RAG sobre PDFs con LangChain, Chroma y Groq"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "ollama>=0.6.3",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
]
